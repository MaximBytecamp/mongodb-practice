# Дополнение к ../compose.yaml для Codespaces: контейнер, в котором открывается редактор.
# Пути считаются от корня репозитория — там лежит первый compose-файл.
services:
  workspace:
    image: mcr.microsoft.com/devcontainers/python:3.12
    command: sleep infinity
    volumes:
      - .:/workspaces/mongodb-practice:cached
    # Редактор в сети сервера: MongoDB доступна по mongodb://localhost:27017
    network_mode: "service:mongo"
    depends_on:
      seed:
        condition: service_completed_successfully
